name: Build, test and release Maccy

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build app and test bundles
        run: >-
          xcodebuild build-for-testing -project Maccy.xcodeproj -scheme Maccy
          -destination 'platform=macOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO
      - name: Run unit tests
        run: >-
          xcodebuild test-without-building -project Maccy.xcodeproj -scheme Maccy
          -destination 'platform=macOS' -parallel-testing-enabled NO
          -derivedDataPath build -resultBundlePath UnitTests.xcresult
          -test-timeouts-enabled YES -default-test-execution-time-allowance 30
          -only-testing:MaccyTests CODE_SIGNING_ALLOWED=NO
      - name: Verify screenshot paste and Accessibility on the isolated runner
        run: >-
          xcodebuild test-without-building -project Maccy.xcodeproj -scheme Maccy
          -destination 'platform=macOS' -parallel-testing-enabled NO
          -derivedDataPath build -resultBundlePath AccessibilityTests.xcresult
          -only-testing:MaccyUITests/MaccyUITests/testAccessibilityPermissionForPaste
          -only-testing:MaccyUITests/MaccyUITests/testImageRestoredScreenshotPastesIntoTextEdit
          CODE_SIGNING_ALLOWED=NO
      - name: Run application UI tests
        run: >-
          xcodebuild test-without-building -project Maccy.xcodeproj -scheme Maccy
          -destination 'platform=macOS' -parallel-testing-enabled NO
          -derivedDataPath build -resultBundlePath UITests.xcresult
          -only-testing:MaccyUITests
          -skip-testing:MaccyUITests/MaccyUITests/testAccessibilityPermissionForPaste
          -skip-testing:MaccyUITests/MaccyUITests/testImageRestoredScreenshotPastesIntoTextEdit
          CODE_SIGNING_ALLOWED=NO
      - name: Export UI screenshots
        if: always()
        run: |
          for bundle in *Tests.xcresult; do
            if [ -d "$bundle" ]; then
              xcrun xcresulttool export attachments --path "$bundle" --output-path "screenshots/${bundle%.xcresult}"
            fi
          done
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Screenshots
          path: screenshots
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: |
            *.xcresult
            screenshots

  package:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify universal Release DMG
        run: ./scripts/build-release.sh
      - name: Smoke test the packaged app on the isolated runner
        run: |
          build/Build/Products/Release/Maccy.app/Contents/MacOS/Maccy \
            -ignoreEvents YES -SUEnableAutomaticChecks NO > build/launch.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          sleep 5
          kill -0 "$app_pid"
          kill "$app_pid"
          wait "$app_pid" || test "$?" -eq 143
      - name: Sign update archive and appcast
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          test -n "$SPARKLE_PRIVATE_KEY"
          version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' build/Build/Products/Release/Maccy.app/Contents/Info.plist)
          test "$GITHUB_REF_NAME" = "v$version"
          signer=build/SourcePackages/artifacts/sparkle/Sparkle/bin/sign_update
          export UPDATE_SIGNATURE
          UPDATE_SIGNATURE=$(printf '%s' "$SPARKLE_PRIVATE_KEY" | "$signer" --ed-key-file - -p dist/Maccy.app.zip)
          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$signer" --ed-key-file - --verify dist/Maccy.app.zip "$UPDATE_SIGNATURE"
          python3 scripts/create-appcast.py
          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$signer" --ed-key-file - dist/appcast.xml
          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$signer" --ed-key-file - --verify dist/appcast.xml
      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: Maccy-release
          if-no-files-found: error
          path: dist/*
      - name: Upload launch diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Release-diagnostics
          path: build/launch.log

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Maccy-release
          path: dist
      - name: Publish tested release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag --title "Maccy $GITHUB_REF_NAME — image history" \
            --notes-file RELEASE_NOTES.md --latest
